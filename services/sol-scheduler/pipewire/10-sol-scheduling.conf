# Install as /usr/share/pipewire/pipewire.conf.d/10-sol-scheduling.conf.
# PipeWire merges this documented section into libpipewire-module-rt args.
module.rt.args = {
    nice.level = -5
    rt.prio = 10
    rt.time.soft = 200000
    rt.time.hard = 200000
    rlimits.enabled = true
    rtportal.enabled = true
    rtkit.enabled = true
}

# 256-512 samples at 48 kHz gives a 5.33-10.67 ms hardware timeline.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 512
    default.clock.min-quantum = 256
    default.clock.max-quantum = 512
}
