[package]
name = "sol-init"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
nix = { version = "0.29", features = ["process", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ctrlc = "3.4"

[lib]
name = "sol_init"
path = "src/lib.rs"

[[bin]]
name = "sol-init"
path = "src/main.rs"
