[package]
name = "sol-compositor"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
autotests = false
autoexamples = false

[dependencies]
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }

# SCP (SOL Compositor Protocol) dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libc = "0.2"

# The compositor cannot inherit `[workspace.lints]`. That table sets
# `unsafe_code = "forbid"`, and `forbid` is deliberately not overridable — but
# this crate is the one that talks to the kernel directly: SCM_RIGHTS descriptor
# passing, memfd sealing, getrandom, poll. Inheriting would not compile, so
# before this table existed the crate simply had *no* lint policy at all: the
# clippy rules the rest of the workspace agreed on were silently inert exactly
# where the attack surface is largest.
#
# This is that policy, restated locally, with the one exception made explicit.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Deferred rather than dismissed: roughly 600 findings, none of them
# correctness. Worth turning on a module at a time, not as one mechanical sweep
# that would bury the diff this policy exists to make readable.
pedantic = "allow"
nursery = "allow"

[features]
default = []

[dev-dependencies]
nix = { version = "0.30", features = ["socket", "uio"] }
serial_test = "4.0.1"

[[test]]
name = "scp_session"
path = "tests/scp_session.rs"

[[test]]
name = "scp_input"
path = "tests/scp_input.rs"

[[test]]
name = "scp_events"
path = "tests/scp_events.rs"

[[test]]
name = "scp_identity"
path = "tests/scp_identity.rs"

[[example]]
name = "scp-client"
path = "examples/scp-client.rs"
