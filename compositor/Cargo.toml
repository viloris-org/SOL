[package]
name = "sol-compositor"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
autotests = false
autoexamples = false

[dependencies]
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }

# SCP (SOL Compositor Protocol) dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libc = "0.2"

[features]
default = []

[dev-dependencies]
nix = { version = "0.30", features = ["socket", "uio"] }
serial_test = "4.0.1"

[[test]]
name = "scp_session"
path = "tests/scp_session.rs"

[[test]]
name = "scp_input"
path = "tests/scp_input.rs"

[[test]]
name = "scp_events"
path = "tests/scp_events.rs"

[[example]]
name = "scp-client"
path = "examples/scp-client.rs"
