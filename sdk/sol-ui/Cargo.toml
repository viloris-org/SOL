[package]
name = "sol-ui"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false

[dependencies]
accesskit = { version = "0.24.1", optional = true }
accesskit_unix = { version = "0.22.1", optional = true }
sol-design = { path = "../sol-design" }
sol-animation = { path = "../sol-animation" }
slint = { version = "=1.13.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-winit-software"], optional = true }

[dev-dependencies]
atspi-connection = "0.14"
atspi-proxies = "0.14"
futures-lite = "2"

[features]
default = []
# Compiles the ADR-0004 Slint adapter. The public API remains Slint-free.
native = ["dep:slint"]
# Exposes the SolUI semantic tree through AccessKit's Unix AT-SPI adapter.
atspi = ["dep:accesskit", "dep:accesskit_unix"]
