name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable-2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libs (EGL/Wayland for the compositor winit backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgles2 libgbm1 libgl1-mesa-dri \
            libwayland-dev libwayland-bin \
            libxkbcommon-dev \
            xwayland xvfb
      - name: Install Rust (stable-2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Default features only. The `udev` feature (DRM/GBM/libseat) requires a
      # host libdisplay-info < 0.3.0 and a real seat (ADR-0005); it is
      # exercised on hardware in Phase 1+, not in CI.
      - name: cargo check (workspace, default features)
        run: cargo check --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgles2 libgbm1 libgl1-mesa-dri \
            libwayland-dev libwayland-bin \
            libxkbcommon-dev
      - name: Install Rust (stable-2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (workspace, default features)
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # The compositor's winit backend needs an X/Wayland display; run tests
    # under xvfb so the integration suite (sol_session) can actually draw.
    steps:
      - uses: actions/checkout@v4
      - name: Install system libs + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 libgles2 libgbm1 libgl1-mesa-dri \
            libwayland-dev libwayland-bin \
            libxkbcommon-dev
      - name: Install Rust (stable-2024)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: xvfb-run -a cargo test --workspace -- --nocapture
