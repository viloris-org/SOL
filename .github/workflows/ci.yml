name: CI

on:
   push:
     branches: [main]
   pull_request:

env:
   CARGO_TERM_COLOR: always
   RUSTFLAGS: "-D warnings"

permissions:
   contents: read

jobs:
   fmt:
     name: Format
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v5
       - name: Install pinned Rust toolchain
         uses: dtolnay/rust-toolchain@stable
         with:
           toolchain: 1.98.0
           components: rustfmt
       - uses: Swatinem/rust-cache@v2
       - name: rustfmt check
         run: cargo fmt --all -- --check

   check:
     name: Check
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v5
       - name: Install system libs
         run: |
           sudo apt-get update
           sudo apt-get install -y libdbus-1-dev libpam0g-dev
       - name: Install pinned Rust toolchain
         uses: dtolnay/rust-toolchain@stable
         with:
           toolchain: 1.98.0
       - uses: Swatinem/rust-cache@v2
       - name: cargo check (workspace, default features)
         run: cargo check --workspace --locked

   clippy:
     name: Clippy
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v5
       - name: Install system libs
         run: |
           sudo apt-get update
           sudo apt-get install -y libdbus-1-dev libpam0g-dev
       - name: Install pinned Rust toolchain
         uses: dtolnay/rust-toolchain@stable
         with:
           toolchain: 1.98.0
           components: clippy
       - uses: Swatinem/rust-cache@v2
       - name: cargo clippy (workspace, default features)
         run: cargo clippy --workspace --locked -- -D warnings

   test:
     name: Test
     runs-on: ubuntu-latest
     # Native SCP integration tests need only a Unix runtime directory; they do
     # not open a host display or load a compatibility compositor protocol.
     env:
       # Required for the SCP Unix socket path.
       XDG_RUNTIME_DIR: /tmp
     steps:
       - uses: actions/checkout@v5
       - name: Install system libs
         run: |
           sudo apt-get update
           sudo apt-get install -y libdbus-1-dev libpam0g-dev
       - name: Install pinned Rust toolchain
         uses: dtolnay/rust-toolchain@stable
         with:
           toolchain: 1.98.0
       - uses: Swatinem/rust-cache@v2
       - name: Validate SCP-only boundary
         run: ./scripts/validate-scp-only.sh
       - name: cargo test (workspace)
         run: cargo test --workspace --locked -- --nocapture
