[workspace]
resolver = "3"
members = [
    "boot/sol-boot-core",
    "boot/sol-boot",
    "boot/sol-image",
    "compositor",
    "shell",
    "session",
    "sdk/sol-design",
    "sdk/sol-ui",
    "sdk/sol-app",
    "sdk/sol-graphics",
    "sdk/sol-animation",
    "sdk/sol-system",
    "services/sol-init",
    "services/sol-scheduler",
    "services/sol-settingsd",
    "services/sol-notificationd",
    "services/sol-portal",
    "services/sol-ime",
    "services/sol-logind",
    "services/sol-diagnostics",
    "services/sol-ntpd",
    "services/sol-networkd",
    "services/sol-audiod",
    "services/sol-deviced",
    "apps/sol-files",
    "apps/sol-terminal",
    "apps/sol-settings",
    "apps/sol-installer",
    "examples/solkit-showcase",
    "packaging/sol/bundle",
    "lyra",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://example.invalid/sol"
homepage = "https://example.invalid/sol"
license = "BSD-3-Clause"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
