[package]
name = "sol-shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
anyhow = "1.0"

# SOL design tokens (single source of truth for visual parameters — PRD §19).
sol-design = { path = "../sdk/sol-design" }
sol-app = { path = "../sdk/sol-app" }
sol-graphics = { path = "../sdk/sol-graphics" }
sol-system = { path = "../sdk/sol-system" }
sol-animation = { path = "../sdk/sol-animation" }
sol-ui = { path = "../sdk/sol-ui" }

[dev-dependencies]
sol-settingsd = { path = "../services/sol-settingsd" }
sol-notificationd = { path = "../services/sol-notificationd" }
