[package]
name = "lyra"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Terminal interaction
reedline = "0.37"
crossterm = "0.28"
nu-ansi-term = "0.50"

# Parsing
logos = "0.14"

# Data model
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Process management
nix = { version = "0.29", features = ["process", "signal"] }

# Fuzzy search
nucleo-matcher = "0.3"

# Configuration
directories = "5.0"

# Time
chrono = "0.4"
filetime = "0.2"

# System info
hostname = "0.4"
term_size = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# SOL integration
sol-design = { path = "../sdk/sol-design" }
sol-system = { path = "../sdk/sol-system" }

[dev-dependencies]
tokio-test = "0.4"
